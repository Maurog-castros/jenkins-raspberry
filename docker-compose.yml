version: "3.8"

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  jenkins-net:
    driver: bridge

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  jenkins-agent-workspace:
    driver: local

# ── Services ──────────────────────────────────────────────────────────────────
services:
  jenkins-agent:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        AGENT_UID: "1000"
        AGENT_GID: "1000"
    image: jenkins-agent-rpi:latest

    restart: unless-stopped

    environment:
      JENKINS_URL: "${JENKINS_URL}"
      AGENT_NAME: "${AGENT_NAME}"
      AGENT_SECRET: "${AGENT_SECRET}"
      # Optional: set to "ssh" to use SSH-based connection instead of JNLP
      AGENT_MODE: "${AGENT_MODE:-jnlp}"
      JAVA_OPTS: "${JAVA_OPTS:--Xms64m -Xmx256m -XX:+UseSerialGC -Djava.awt.headless=true}"

    volumes:
      - jenkins-agent-workspace:/home/jenkins/agent
      # Optional: mount Docker socket for Docker-in-Docker (comment out if not needed)
      # - /var/run/docker.sock:/var/run/docker.sock

    networks:
      - jenkins-net

    healthcheck:
      test: ["CMD", "curl", "-fsSL", "--max-time", "5", "${JENKINS_URL}/login"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

    # Limit resource usage on Raspberry Pi 3 (1 GB RAM)
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
